name: Beta independent push step 9
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notification-independent-step9]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/independent_push_reminder_targets_step9.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check edge function syntax
        run: npx esbuild supabase/functions/process-notification-push-queue/index.ts --bundle --outfile=/tmp/push-worker-check.js --format=esm --platform=neutral --external:npm:*
      - name: Validate scope
        run: |
          grep -q 'function wantsPush' src/main.jsx
          grep -q 'isPushOnlyNotification' src/main.jsx
          grep -q 'canais independentes' src/main.jsx
          ! grep -q 'disabled={!systemOn}' src/main.jsx
          ! grep -q "\['task_responsible','admins'\]" supabase/functions/process-notification-push-queue/index.ts
          grep -q 'pushOnly: !systemEnabled && pushEnabled' supabase/functions/process-notification-push-queue/index.ts
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx supabase/functions/process-notification-push-queue/index.ts
          git rm scripts/independent_push_reminder_targets_step9.py .github/workflows/beta-independent-push-step9.yml
          git commit -m "Beta: separa Sistema e Push [notification-independent-step9]"
          git pull --rebase origin beta
          git push origin HEAD:beta
