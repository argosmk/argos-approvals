name: Fix header offset beta

on:
  push:
    branches: [beta]
    paths: ['.github/workflows/fix-header-offset-beta.yml']

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply exact dashboard header metric
        run: |
          cat >> src/style.css <<'CSS'

/* ROUND 2026-09-14: header baseline exact match with Dashboard */
/* Dashboard reference: the divider follows only the 9px title padding. */
.main .radar .radar-head,
.main .rep .rep-head,
.main .documents-page .panel-header-block.docs-topbar > .panel-tabs-header{
  min-height:0!important;
  padding:0!important;
  margin:0!important;
  border-bottom:1px solid rgba(255,255,255,.09)!important;
  box-sizing:border-box!important;
}
.main .radar .radar-head::after,
.main .rep .rep-head::after{
  content:none!important;
  display:none!important;
}
.main .radar .radar-head h1,
.main .rep .rep-head h1,
.main .documents-page .panel-header-block.docs-topbar .panel-tabs-heading > h1{
  min-height:0!important;
  margin:0!important;
  padding:0 0 9px!important;
  font-size:20px!important;
  line-height:1.15!important;
  font-weight:750!important;
  letter-spacing:0!important;
  box-sizing:border-box!important;
}
CSS
      - run: npm ci
      - run: npm run build
      - name: Commit fix and cleanup workflow
        run: |
          git config user.name "argos-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/style.css
          git commit -m "Beta: alinha Radar Relatórios e Documentos ao Dashboard"
          git rm .github/workflows/fix-header-offset-beta.yml
          git commit -m "Beta: remove workflow temporário de alinhamento"
          git push origin beta
