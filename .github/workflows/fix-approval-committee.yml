name: Fix approval committee
on:
  push:
    paths:
      - '.github/workflows/fix-approval-committee.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch approval committee
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text(encoding='utf-8')
          def replace_between(text,start,end,new):
              a=text.index(start); b=text.index(end,a)
              return text[:a]+new+text[b:]

          approve=r'''  function approve(){
            if(!clientForm?.art||!clientForm?.caption) return alert('Selecione artes/vídeos aprovados e legenda aprovada para aprovar.');
            const eventAt=now();
            if(isMultiApprover){
              if((task.approvalVotes||[]).some(v=>v.userId===effectiveUser.id)){
                alert('Você já registrou sua decisão para esta tarefa.'); setClientForm(null); return;
              }
              const votes=[...(task.approvalVotes||[]),{userId:effectiveUser.id,userName:effectiveUser.name,decision:'approve',at:eventAt}];
              const allResponded=votes.length>=approversForCompany.length;
              const hasChange=votes.some(v=>v.decision==='change');
              const names=votes.map(v=>`${v.userName} (${v.decision==='change'?'alteração':'aprovou'})`).join(', ');
              const targetStatus=hasChange?'alteracao':'agendamento';
              const entry={id:safeUUID(),user:effectiveUser.name,userId:effectiveUser.id,type:'comment',visibility:isClient?'client':'internal',at:eventAt,text:`${effectiveUser.name} aprovou a tarefa. (${votes.length} de ${approversForCompany.length} responderam)`,resolved:false,statusAtTime:task.status,...(allResponded?{fromStatusId:task.status,toStatusId:targetStatus}:{})};
              if(allResponded){
                updateTask(task.id,{status:targetStatus,approvalVotes:[],alterationCount:hasChange?(task.alterationCount||0)+1:(task.alterationCount||0),logs:[...(task.logs||[]),entry],statusLogText:hasChange?'Todos responderam; houve solicitação de alteração':'Todos os aprovadores aprovaram a tarefa'});
                notifyTask(task,hasChange?`Todos os ${approversForCompany.length} representantes responderam (${names}). Como houve solicitação de alteração, a tarefa voltou para Alteração.`:`Todos os ${approversForCompany.length} representantes aprovaram (${names}). A tarefa avançou automaticamente para Agendamento.`,'Aprovação',targetStatus,effectiveUser.id,{actorName:effectiveUser.name,at:eventAt});
                setClientForm(null); notifySettingsSaved(hasChange?'Comitê concluído — tarefa voltou para Alteração':'Todos aprovaram — tarefa avançada automaticamente'); return;
              }
              updateTask(task.id,{approvalVotes:votes,logs:[...(task.logs||[]),entry]},`Decisão registrada (${votes.length} de ${approversForCompany.length}).`);
              notifyTask(task,`${votes.length} de ${approversForCompany.length} representantes responderam (${names}). A tarefa permanece em Aprovação até todos decidirem.`,'Aprovação',task.status,effectiveUser.id,{actorName:effectiveUser.name,at:eventAt});
              setClientForm(null); notifySettingsSaved('Decisão registrada'); return;
            }
            const entry={id:safeUUID(),user:effectiveUser.name,userId:effectiveUser.id,type:'comment',visibility:isClient?'client':'internal',at:eventAt,text:`${effectiveUser.name} aprovou a tarefa.`,resolved:false,statusAtTime:task.status,fromStatusId:task.status,toStatusId:'agendamento'};
            updateTask(task.id,{status:'agendamento',approvalVotes:[],logs:[...(task.logs||[]),entry],statusLogText:`${effectiveUser.name} aprovou a tarefa`});
            setClientForm(null); notifySettingsSaved('Tarefa aprovada');
          }
'''
          s=replace_between(s,'  function approve(){','  function approveCopy(){',approve)

          approve_copy=r'''  function approveCopy(){
            if(!clientForm?.copyApproved||!clientForm?.captionApproved) return alert('Marque Copy aprovada e Legenda aprovada para concluir a aprovação.');
            if(clientForm?.copyChange||clientForm?.captionChange) return alert('Remova as opções de alteração antes de aprovar.');
            if(!createPostStatusId) return alert('Não foi possível identificar o próximo status após Aprovar copy.');
            const eventAt=now();
            if(isMultiApprover){
              if((task.copyApprovalVotes||[]).some(v=>v.userId===effectiveUser.id)){
                alert('Você já registrou sua decisão sobre copy e legenda para esta tarefa.'); setClientForm(null); return;
              }
              const votes=[...(task.copyApprovalVotes||[]),{userId:effectiveUser.id,userName:effectiveUser.name,decision:'approve',copyApproved:true,captionApproved:true,at:eventAt}];
              const allResponded=votes.length>=approversForCompany.length;
              const hasChange=votes.some(v=>v.decision==='change');
              const names=votes.map(v=>`${v.userName} (${v.decision==='change'?'alteração':'aprovou'})`).join(', ');
              const targetStatus=hasChange?createCopyStatusId:createPostStatusId;
              const entry={id:safeUUID(),user:effectiveUser.name,userId:effectiveUser.id,type:'comment',visibility:isClient?'client':'internal',at:eventAt,text:`${effectiveUser.name} aprovou copy e legenda. (${votes.length} de ${approversForCompany.length} responderam)`,resolved:false,statusAtTime:task.status,...(allResponded?{fromStatusId:task.status,toStatusId:targetStatus}:{})};
              if(allResponded){
                updateTask(task.id,{status:targetStatus,copyApprovalVotes:[],logs:[...(task.logs||[]),entry],statusLogText:hasChange?'Todos responderam; houve solicitação de alteração na copy':'Todos os aprovadores aprovaram copy e legenda'});
                notifyTask(task,hasChange?`Todos os ${approversForCompany.length} representantes responderam (${names}). Como houve solicitação de alteração, a tarefa voltou para Criar copy.`:`Todos os ${approversForCompany.length} representantes aprovaram copy e legenda (${names}). A tarefa avançou automaticamente.`,'Aprovação',targetStatus,effectiveUser.id,{actorName:effectiveUser.name,at:eventAt});
                setClientForm(null); notifySettingsSaved(hasChange?'Comitê concluído — copy voltou para alteração':'Todos aprovaram — copy avançada automaticamente'); return;
              }
              updateTask(task.id,{copyApprovalVotes:votes,logs:[...(task.logs||[]),entry]},`Decisão de copy registrada (${votes.length} de ${approversForCompany.length}).`);
              notifyTask(task,`${votes.length} de ${approversForCompany.length} representantes responderam (${names}). A tarefa permanece em Aprovar copy até todos decidirem.`,'Aprovação',task.status,effectiveUser.id,{actorName:effectiveUser.name,at:eventAt});
              setClientForm(null); notifySettingsSaved('Decisão de copy registrada'); return;
            }
            const entry={id:safeUUID(),user:effectiveUser.name,userId:effectiveUser.id,type:'comment',visibility:isClient?'client':'internal',at:eventAt,text:`${effectiveUser.name} aprovou copy e legenda.`,resolved:false,statusAtTime:task.status,fromStatusId:task.status,toStatusId:createPostStatusId};
            updateTask(task.id,{status:createPostStatusId,copyApprovalVotes:[],logs:[...(task.logs||[]),entry],statusLogText:`${effectiveUser.name} aprovou copy e legenda`});
            setClientForm(null); notifySettingsSaved('Copy e legenda aprovadas');
          }
'''
          s=replace_between(s,'  function approveCopy(){','  function requestCopyChange(){',approve_copy)

          request_copy=r'''  function requestCopyChange(){
            const items=[];
            if(clientForm?.copyChange) items.push('Alterar copy');
            if(clientForm?.captionChange) items.push('Alterar legenda');
            if(!items.length) return alert('Selecione Alterar copy e/ou Alterar legenda.');
            const desc=String(clientForm?.copyDescription||'').trim();
            if(!desc) return alert('Descreva o que precisa ser alterado.');
            const text=`Solicitação de alteração\nItens marcados: ${items.join(', ')}\nDescrição: ${desc}`;
            const eventAt=now();
            if(isMultiApprover){
              if((task.copyApprovalVotes||[]).some(v=>v.userId===effectiveUser.id)){ alert('Você já registrou sua decisão sobre esta copy.'); setClientForm(null); return; }
              const votes=[...(task.copyApprovalVotes||[]),{userId:effectiveUser.id,userName:effectiveUser.name,decision:'change',items:[...items],description:desc,at:eventAt}];
              const allResponded=votes.length>=approversForCompany.length;
              const names=votes.map(v=>`${v.userName} (${v.decision==='change'?'alteração':'aprovou'})`).join(', ');
              const entry={id:safeUUID(),user:effectiveUser.name,userId:effectiveUser.id,type:'comment',visibility:isClient?'client':'internal',at:eventAt,text:`${text}\n(${votes.length} de ${approversForCompany.length} responderam)`,resolved:false,statusAtTime:task.status,...(allResponded?{fromStatusId:task.status,toStatusId:createCopyStatusId}:{})};
              if(allResponded){
                updateTask(task.id,{status:createCopyStatusId,copyApprovalVotes:[],logs:[...(task.logs||[]),entry],statusLogText:'Todos responderam; houve solicitação de alteração na copy'});
                if(isClient) notifyTask(task,`Todos os ${approversForCompany.length} representantes responderam (${names}). A tarefa voltou para Criar copy.`,CLIENT_REQUEST_NOTIFICATION_EVENT,createCopyStatusId,effectiveUser.id,{actorName:effectiveUser.name,logId:entry.id,at:eventAt});
                setClientForm(null); notifySettingsSaved('Comitê concluído — alteração de copy solicitada'); return;
              }
              updateTask(task.id,{copyApprovalVotes:votes,logs:[...(task.logs||[]),entry]},`Solicitação registrada (${votes.length} de ${approversForCompany.length} responderam).`);
              if(isClient) notifyTask(task,`${effectiveUser.name} solicitou alteração. ${votes.length} de ${approversForCompany.length} representantes responderam; a tarefa permanece em Aprovar copy.`,CLIENT_REQUEST_NOTIFICATION_EVENT,task.status,effectiveUser.id,{actorName:effectiveUser.name,logId:entry.id,at:eventAt});
              setClientForm(null); notifySettingsSaved('Solicitação registrada — aguardando demais representantes'); return;
            }
            const entry={id:safeUUID(),user:effectiveUser.name,userId:effectiveUser.id,type:'comment',visibility:isClient?'client':'internal',at:eventAt,text,resolved:false,statusAtTime:task.status,fromStatusId:task.status,toStatusId:createCopyStatusId};
            updateTask(task.id,{status:createCopyStatusId,copyApprovalVotes:[],logs:[...(task.logs||[]),entry],statusLogText:`${effectiveUser.name} solicitou alteração em ${items.join(' e ')}`});
            if(isClient) notifyTask(task,text,CLIENT_REQUEST_NOTIFICATION_EVENT,createCopyStatusId,effectiveUser.id,{actorName:effectiveUser.name,logId:entry.id,at:eventAt});
            setClientForm(null); notifySettingsSaved('Alteração solicitada');
          }
'''
          s=replace_between(s,'  function requestCopyChange(){','  function requestChange(){',request_copy)

          request_change=r'''  function requestChange(){
            const items=[];
            if(clientForm?.artChange) items.push('Alterar design da arte/vídeo');
            if(clientForm?.text) items.push('Alterar texto na arte/vídeo');
            if(clientForm?.captionChange) items.push('Alterar legenda');
            if(!items.length) return alert('Selecione pelo menos uma opção de alteração.');
            const desc=String(clientForm?.description||'').trim();
            if(!desc) return alert('Descreva as alterações que você gostaria de aplicar.');
            const text=`Solicitação de alteração\nItens marcados: ${items.join(', ')}\nDescrição: ${desc}`;
            const eventAt=now();
            if(isMultiApprover){
              if((task.approvalVotes||[]).some(v=>v.userId===effectiveUser.id)){ alert('Você já registrou sua decisão para esta tarefa.'); setClientForm(null); return; }
              const votes=[...(task.approvalVotes||[]),{userId:effectiveUser.id,userName:effectiveUser.name,decision:'change',items:[...items],description:desc,at:eventAt}];
              const allResponded=votes.length>=approversForCompany.length;
              const names=votes.map(v=>`${v.userName} (${v.decision==='change'?'alteração':'aprovou'})`).join(', ');
              const entry={id:safeUUID(),user:effectiveUser.name,userId:effectiveUser.id,type:'comment',visibility:isClient?'client':'internal',at:eventAt,text:`${text}\n(${votes.length} de ${approversForCompany.length} responderam)`,resolved:false,statusAtTime:task.status,...(allResponded?{fromStatusId:task.status,toStatusId:'alteracao'}:{})};
              if(allResponded){
                updateTask(task.id,{status:'alteracao',approvalVotes:[],alterationCount:(task.alterationCount||0)+1,logs:[...(task.logs||[]),entry],statusLogText:'Todos responderam; houve solicitação de alteração'});
                if(isClient) notifyTask(task,`Todos os ${approversForCompany.length} representantes responderam (${names}). A tarefa voltou para Alteração.`,CLIENT_REQUEST_NOTIFICATION_EVENT,'alteracao',effectiveUser.id,{actorName:effectiveUser.name,logId:entry.id,at:eventAt});
                setClientForm(null); notifySettingsSaved('Comitê concluído — alteração solicitada'); return;
              }
              updateTask(task.id,{approvalVotes:votes,logs:[...(task.logs||[]),entry]},`Solicitação registrada (${votes.length} de ${approversForCompany.length} responderam).`);
              if(isClient) notifyTask(task,`${effectiveUser.name} solicitou alteração. ${votes.length} de ${approversForCompany.length} representantes responderam; a tarefa permanece em Aprovação.`,CLIENT_REQUEST_NOTIFICATION_EVENT,task.status,effectiveUser.id,{actorName:effectiveUser.name,logId:entry.id,at:eventAt});
              setClientForm(null); notifySettingsSaved('Solicitação registrada — aguardando demais representantes'); return;
            }
            const entry={id:safeUUID(),user:effectiveUser.name,userId:effectiveUser.id,type:'comment',visibility:isClient?'client':'internal',at:eventAt,text,resolved:false,statusAtTime:task.status,fromStatusId:task.status,toStatusId:'alteracao'};
            updateTask(task.id,{status:'alteracao',approvalVotes:[],alterationCount:(task.alterationCount||0)+1,logs:[...(task.logs||[]),entry],statusLogText:`${effectiveUser.name} solicitou alteração`});
            if(isClient) notifyTask(task,text,CLIENT_REQUEST_NOTIFICATION_EVENT,'alteracao',effectiveUser.id,{actorName:effectiveUser.name,logId:entry.id,at:eventAt});
            setClientForm(null); notifySettingsSaved('Alteração solicitada');
          }
'''
          s=replace_between(s,'  function requestChange(){','  function reopenFromApproval(){',request_change)
          s=s.replace("`${effectiveUser.name} retirou o voto de aprovação (${votes.length} de ${approversForCompany.length}).`","`${effectiveUser.name} retirou sua decisão (${votes.length} de ${approversForCompany.length} responderam).`")
          s=s.replace("`${effectiveUser.name} retirou o voto de aprovação da copy (${votes.length} de ${approversForCompany.length}).`","`${effectiveUser.name} retirou sua decisão sobre a copy (${votes.length} de ${approversForCompany.length} responderam).`")
          old="{isMultiApprover&&task.status==='aprovacao'&&(task.approvalVotes?.length>0)&&<div className=\"approval-votes-banner\">⚠ {task.approvalVotes.length} de {approversForCompany.length} usuários aprovaram ({task.approvalVotes.map(v=>v.userName).join(', ')}). Confirme manualmente antes de despachar.</div>}"
          new="{isMultiApprover&&task.status==='aprovacao'&&(task.approvalVotes?.length>0)&&<div className=\"approval-votes-banner\">⚠ {task.approvalVotes.length} de {approversForCompany.length} usuários responderam ({task.approvalVotes.map(v=>`${v.userName}: ${v.decision==='change'?'alteração':'aprovou'}`).join(', ')}).</div>}"
          if old not in s: raise SystemExit('banner aprovação não encontrado')
          s=s.replace(old,new)
          old="{isMultiApprover&&isApproveCopyStatus&&(task.copyApprovalVotes?.length>0)&&<div className=\"approval-votes-banner\">⚠ {task.copyApprovalVotes.length} de {approversForCompany.length} usuários aprovaram a copy ({task.copyApprovalVotes.map(v=>v.userName).join(', ')}). Confirme manualmente antes de despachar.</div>}"
          new="{isMultiApprover&&isApproveCopyStatus&&(task.copyApprovalVotes?.length>0)&&<div className=\"approval-votes-banner\">⚠ {task.copyApprovalVotes.length} de {approversForCompany.length} usuários responderam ({task.copyApprovalVotes.map(v=>`${v.userName}: ${v.decision==='change'?'alteração':'aprovou'}`).join(', ')}).</div>}"
          if old not in s: raise SystemExit('banner copy não encontrado')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          css=Path('src/style.css')
          c=css.read_text(encoding='utf-8')
          c+='''\n/* Approval committee timeline: pendente legível; resolvido atenuado. */\n.comments-panel .timeline-entry.is-comment:not(.resolved) p,\n.comments-panel .timeline-entry.is-comment:not(.resolved) .timeline-log-text{color:var(--text)!important;opacity:1!important;text-decoration:none!important}\n.comments-panel .timeline-entry.is-comment.resolved p,\n.comments-panel .timeline-entry.is-comment.resolved .timeline-log-text{color:var(--muted)!important;opacity:.68!important;text-decoration:line-through!important}\n'''
          css.write_text(c,encoding='utf-8')
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name "argos-bot"
          git config user.email "argos-bot@users.noreply.github.com"
          git add src/main.jsx src/style.css
          git commit -m "Alfa: completa decisões do comitê de aprovação"
          git push origin main