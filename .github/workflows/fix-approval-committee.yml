name: Fix approval committee
on:
  push:
    paths:
      - '.github/workflows/fix-approval-committee.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/patch_approval.py
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name argos-bot
          git config user.email argos-bot@users.noreply.github.com
          git add src/main.jsx src/style.css
          git commit -m "Alfa: completa decisões do comitê de aprovação"
          git push origin main
