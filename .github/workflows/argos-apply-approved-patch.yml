name: Apply approved ARGOS patch
on:
  push:
    branches:
      - argos-alfa-ajustes-20260910
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[argos-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: argos-alfa-ajustes-20260910
          fetch-depth: 0
      - name: Rebuild and apply patch
        run: |
          cat tmp/argos_patch_parts/part*.b64 | base64 -d > /tmp/argos.patch
          git apply --check /tmp/argos.patch
          git apply /tmp/argos.patch
      - name: Validate scope
        run: |
          ! grep -q "andre@argosmk.com" src/main.jsx
          ! grep -q "Argos@123" src/main.jsx
          ! grep -q "Mock / localStorage" src/main.jsx
          ! grep -q "import.meta.env.MODE === 'localdev'" src/main.jsx
          grep -q "Todos os aprovadores aprovaram a tarefa" src/main.jsx
          grep -q "Copy aprovada" src/main.jsx
          grep -q "Alterar design da arte/vídeo" src/main.jsx
          ! grep -q "Refazer o post" src/main.jsx
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit approved changes
        run: |
          git config user.name "ARGOS Patch Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx src/services/panelAccess.js src/style.css
          git commit -m "Ajusta aprovações e acessos personalizados [argos-patch-applied]"
          git push origin HEAD:argos-alfa-ajustes-20260910
