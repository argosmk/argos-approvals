name: Beta notification channels step 7
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notification-channels-step7]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/simplify_notification_channels_step7.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check edge function syntax
        run: npx esbuild supabase/functions/process-notification-push-queue/index.ts --bundle --outfile=/tmp/push-worker-check.js --format=esm --platform=neutral --external:npm:*
      - name: Validate scope
        run: |
          grep -q 'NOTIFICATION_EVENT_ROWS' src/main.jsx
          grep -q 'Push só pode ser ativado' src/main.jsx
          grep -q '+ Adicionar lembrete' src/main.jsx
          grep -q 'push_events' src/services/profileTableService.js
          grep -q 'push_status' supabase/functions/process-notification-push-queue/index.ts
          ! grep -q "Prazo vencido','Prazo hoje" src/services/panelAccess.js
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx src/services/panelAccess.js src/services/profileTableService.js supabase/functions/process-notification-push-queue/index.ts
          git rm scripts/simplify_notification_channels_step7.py .github/workflows/beta-notification-channels-step7.yml
          git commit -m "Beta: simplifica notificações por canal [notification-channels-step7]"
          git pull --rebase origin beta
          git push origin HEAD:beta
