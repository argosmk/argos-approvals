name: Sync Alfa to Beta 2026-09-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-alfa-to-beta-20260916.yml']
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Sincronizar melhorias gerais do Alfa
        run: |
          set -e
          git config user.name "argosmk"
          git config user.email "adm.argosconsultoria@gmail.com"
          git fetch origin main beta
          git cherry-pick 7b020691da0b8dc4babb45d34f1a894a2077e778
          git cherry-pick 31ed5a3fe65485baf6cd2287563f38b0d56bfcc6
          # O Beta ainda não possuía o CSS mobile. Copia somente o arquivo final,
          # sem trazer o index.html do Alfa, que contém seed específico de produção.
          git show origin/main:src/taskMobileButtons.css > src/taskMobileButtons.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<link rel="stylesheet" href="/src/taskMobileButtons.css"/>'
          if tag not in s:
              s=s.replace('</head>',tag+'</head>')
          p.write_text(s)
          PY
          git add src/taskMobileButtons.css index.html
          git commit -m "Beta: sincroniza correções mobile de tarefas e solicitações"
          git cherry-pick 3c7a3c22063acb61ef650be1e80f6f6f3f47877f
          git cherry-pick 2ebb232f5467dd1ff2a87546fb6a514556bc488a
      - name: Validar build do Beta
        run: npm ci && npm run build
      - name: Publicar Beta
        run: git push origin beta
