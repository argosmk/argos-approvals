name: Beta notification deadlines step 8
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notification-deadlines-step8]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/notification_deadlines_reminders_step8.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check edge function syntax
        run: npx esbuild supabase/functions/process-notification-push-queue/index.ts --bundle --outfile=/tmp/push-worker-check.js --format=esm --platform=neutral --external:npm:*
      - name: Validate scope
        run: |
          grep -q "Prazo hoje" src/services/panelAccess.js
          grep -q "Prazo vencido" src/services/panelAccess.js
          grep -q "Lembrete de status" supabase/functions/process-notification-push-queue/index.ts
          grep -q "generateDeadlineNotifications" supabase/functions/process-notification-push-queue/index.ts
          test -f supabase/migrations/20260913033500_notification_reminders_deadlines_beta.sql
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/services/panelAccess.js supabase/functions/process-notification-push-queue/index.ts supabase/migrations/20260913033500_notification_reminders_deadlines_beta.sql
          git rm scripts/notification_deadlines_reminders_step8.py .github/workflows/beta-notification-deadlines-step8.yml
          git commit -m "Beta: restaura prazos e completa lembretes [notification-deadlines-step8]"
          git pull --rebase origin beta
          git push origin HEAD:beta
