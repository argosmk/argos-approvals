name: Beta notification compact step 14
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notification-compact-step14]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/notification_compact_step14.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate scope
        run: |
          grep -q "notificationPresentation" src/main.jsx
          grep -q "showCompany:true" src/services/panelAccess.js
          git diff --exit-code -- src/style.css
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx src/services/panelAccess.js
          git rm scripts/notification_compact_step14.py .github/workflows/beta-notification-compact-step14.yml
          git commit -m "Beta: simplifica notificações e restaura metadados [notification-compact-step14]"
          git pull --rebase origin beta
          git push origin HEAD:beta
