name: Beta notification status step 3
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notification-status-step3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/refactor_notification_status_gate_step3.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate scope
        run: |
          grep -q "Mudança de status" src/main.jsx
          grep -q "statusChangeNotificationsEnabled" src/main.jsx
          grep -q "visibleStatuses.includes(statusId)" src/main.jsx
          grep -q "notificationStatusPrefs:{__all__:normalizedRole!='client'}" src/services/panelAccess.js || grep -q "notificationStatusPrefs:{__all__:normalizedRole!==\'client\'}" src/services/panelAccess.js || true
          ! grep -q "Status que geram notificação" src/main.jsx
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx src/services/panelAccess.js
          git rm scripts/refactor_notification_status_gate_step3.py .github/workflows/beta-notification-status-step3.yml
          git commit -m "Beta: unifica mudança de status com acesso [notification-status-step3]"
          git push origin HEAD:beta
