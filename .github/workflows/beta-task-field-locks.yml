name: Beta task field locks
on:
  push:
    branches:
      - beta
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply task field locks
        run: python scripts/apply_task_field_locks.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit validated patch
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git rm .github/workflows/beta-task-field-locks.yml scripts/apply_task_field_locks.py
          git add src/main.jsx
          git commit -m "Beta: bloqueia campos em edição colaborativa [task-field-locks-run]"
          git pull --rebase origin beta
          git push origin HEAD:beta
