name: Beta notification access refactor
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[notification-access-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply refactor
        run: python scripts/refactor_notification_access_beta.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit clean refactor
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx src/services/panelAccess.js supabase/functions/process-notification-push-queue/index.ts
          git rm scripts/refactor_notification_access_beta.py .github/workflows/beta-notification-access-refactor.yml
          git commit -m "Beta: unifica notificações com regras de acesso [notification-access-v2]"
          git push origin HEAD:beta
