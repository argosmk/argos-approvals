name: Beta integrate reminders step 5
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[integrate-reminders-step5]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/integrate_reminders_into_notifications_step5.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate scope
        run: |
          grep -q 'Regras de lembrete' src/main.jsx
          grep -q 'NotificationDeliverySettings currentUser={currentUser} statuses={statuses}' src/main.jsx
          ! grep -q 'Ative só os status que precisam cobrar alguém' src/main.jsx
          test "$(grep -c 'NotificationDeliverySettings currentUser={currentUser} statuses={statuses}' src/main.jsx)" -eq 1
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx
          git rm scripts/integrate_reminders_into_notifications_step5.py .github/workflows/beta-integrate-reminders-step5.yml
          git commit -m "Beta: integra lembretes em notificações [integrate-reminders-step5]"
          git push origin HEAD:beta
