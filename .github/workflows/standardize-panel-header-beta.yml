name: Standardize panel headers beta

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/standardize-panel-header-beta.yml'
      - '.github/scripts/standardize_headers.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply shared panel header standard
        run: python .github/scripts/standardize_headers.py
      - run: npm ci
      - run: npm run build
      - name: Commit standard and cleanup temporary files
        run: |
          git config user.name "argos-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Beta: transforma cabeçalho em padrão global compartilhado"
          git rm .github/workflows/standardize-panel-header-beta.yml .github/scripts/standardize_headers.py
          git commit -m "Beta: remove arquivos temporários da padronização"
          git push origin beta
