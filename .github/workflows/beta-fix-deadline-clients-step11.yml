name: Beta fix deadline clients step 11
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notification-deadline-client-step11]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/fix_notification_deadline_clients_step11.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check edge function syntax
        run: npx esbuild supabase/functions/process-notification-push-queue/index.ts --bundle --outfile=/tmp/push-worker-check.js --format=esm --platform=neutral --external:npm:*
      - name: Validate scope
        run: |
          grep -q 'clientProfileIdsForCompany' supabase/functions/process-notification-push-queue/index.ts
          ! grep -q 'company_ids,notification_prefs' supabase/functions/process-notification-push-queue/index.ts
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add supabase/functions/process-notification-push-queue/index.ts
          git rm scripts/fix_notification_deadline_clients_step11.py .github/workflows/beta-fix-deadline-clients-step11.yml
          git commit -m "Beta: corrige destinatários de prazo [notification-deadline-client-step11]"
          git pull --rebase origin beta
          git push origin HEAD:beta
