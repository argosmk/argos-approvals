name: Alfa compact status notifications
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[compact-status-notifications]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/compact_pending_status_notifications.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit clean result
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx
          git rm scripts/compact_pending_status_notifications.py .github/workflows/alfa-compact-status-notifications.yml
          git commit -m "Alfa: compacta notificações pendentes de status [compact-status-notifications]"
          git pull --rebase origin main
          git push origin HEAD:main
