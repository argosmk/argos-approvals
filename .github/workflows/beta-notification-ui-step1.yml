name: Beta notification UI step 1
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notif-ui-step1]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/beta_notification_ui_step1.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Step Bot"
          git config user.email "actions@github.com"
          git add src/services/panelAccess.js
          git rm scripts/beta_notification_ui_step1.py .github/workflows/beta-notification-ui-step1.yml
          git commit -m "Beta: simplifica permissões do painel de notificações [notif-ui-step1]"
          git push origin HEAD:beta
