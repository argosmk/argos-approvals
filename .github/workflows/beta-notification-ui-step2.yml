name: Beta notification UI step 2
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notification-ui-step2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/notification_ui_step2.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx
          git rm scripts/notification_ui_step2.py .github/workflows/beta-notification-ui-step2.yml
          git commit -m "Beta: move notificações e alertas para regras de acesso [notification-ui-step2]"
          git push origin HEAD:beta
