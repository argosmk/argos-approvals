name: Alfa client request notifications
on:
  push:
    paths:
      - '.github/workflows/alfa-client-request-notifications.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch
        run: python3 .github/scripts/patch-client-request-notifications.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name argosmk
          git config user.email adm.argosconsultoria@gmail.com
          git add src/main.jsx src/services/panelAccess.js
          git commit -m 'Alfa: garante notificações de solicitações de clientes'
          git push origin main
