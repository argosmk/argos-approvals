name: Beta worker error step 12
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notification-worker-error-step12]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/improve_notification_worker_error_step12.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check edge function syntax
        run: npx esbuild supabase/functions/process-notification-push-queue/index.ts --bundle --outfile=/tmp/push-worker-check.js --format=esm --platform=neutral --external:npm:*
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add supabase/functions/process-notification-push-queue/index.ts
          git rm scripts/improve_notification_worker_error_step12.py .github/workflows/beta-worker-error-step12.yml
          git commit -m "Beta: melhora diagnóstico do worker [notification-worker-error-step12]"
          git pull --rebase origin beta
          git push origin HEAD:beta
