name: Beta color reminder status step 10
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[reminder-status-color-step10]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/color_reminder_status_step10.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate scope
        run: |
          grep -q "style={{color:status?.color||undefined}}" src/main.jsx
      - name: Commit clean step
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git add src/main.jsx
          git rm scripts/color_reminder_status_step10.py .github/workflows/beta-color-reminder-status-step10.yml
          git commit -m "Beta: colore status com lembrete [reminder-status-color-step10]"
          git pull --rebase origin beta
          git push origin HEAD:beta
