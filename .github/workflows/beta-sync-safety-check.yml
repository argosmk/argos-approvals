name: Beta sync safety check
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[sync-safety-check-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate atomic task patch wiring
        run: |
          grep -q "supabase.rpc('argos_patch_app_task'" src/services/taskTableService.js
          grep -q "pendingDeletedNotificationIds" src/services/notificationTableService.js
          grep -q "create or replace function public.argos_patch_app_task" supabase/migrations/20260913170000_atomic_task_patch.sql
      - name: Remove temporary workflow
        run: |
          git config user.name "ARGOS Refactor Bot"
          git config user.email "actions@github.com"
          git rm .github/workflows/beta-sync-safety-check.yml
          git commit -m "Beta: remove validação temporária [sync-safety-check-cleanup]"
          git pull --rebase origin beta
          git push origin HEAD:beta
